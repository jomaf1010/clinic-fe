services:
  frontend-test:
    image: node:22-alpine
    working_dir: /app
    environment:
      CI: "true"
    volumes:
      - .:/app
      - frontend_test_node_modules:/app/node_modules
      - frontend_test_npm_cache:/root/.npm
    command: sh -lc "npm ci --prefer-offline && ${TEST_CMD:-npm run test}"

  frontend-feature-test:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    environment:
      CI: "true"
      E2E_BASE_URL: "${E2E_BASE_URL:-https://staging.mediflow.ph}"
      E2E_EMAIL: "${E2E_EMAIL:-}"
      E2E_PASSWORD: "${E2E_PASSWORD:-}"
    volumes:
      - .:/app
      - frontend_feature_node_modules:/app/node_modules
      - frontend_feature_npm_cache:/root/.npm
    command: bash -lc "npm ci --prefer-offline && ${TEST_CMD:-npx playwright test}"

volumes:
  frontend_test_node_modules:
  frontend_test_npm_cache:
  frontend_feature_node_modules:
  frontend_feature_npm_cache:
